<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DiaVet DZ" />
    <meta name="theme-color" content="#020617" />
    <title>DiaVet Algérie — La Plateforme Unifiée de Santé Animale 🇩🇿</title>
    <meta name="description" content="Plateforme numérique vétérinaire pour l'Algérie connectant propriétaires et vétérinaires avec carnet de santé, système de badges et jalons santé, articles et conseils cliniques, et annuaire d'urgences." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white overscroll-none overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // iOS / Android Standalone PWA Fallback Safeguard
      window.addEventListener('error', function(e) {
        console.error('DiaVet PWA Error:', e);
      });
      setTimeout(function() {
        var rootNode = document.getElementById('root');
        if (rootNode && (!rootNode.children || rootNode.children.length === 0)) {
          console.warn('Initializing DiaVet Application interface...');
          rootNode.innerHTML = `
            <div style="min-height:100vh;background-color:#020617;color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;">
              <div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#06b6d4,#10b981);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 10px 25px -5px rgba(6,182,212,0.4);">
                <span style="font-size:32px;font-weight:bold;">🐾</span>
              </div>
              <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">DiaVet Algérie</h1>
              <p style="font-size:14px;color:#94a3b8;max-width:320px;margin-bottom:24px;line-height:1.5;">La plateforme unifiée de santé animale en Algérie</p>
              <button onclick="window.location.reload()" style="background:linear-gradient(90deg,#06b6d4,#10b981);color:#020617;font-weight:bold;font-size:14px;padding:12px 24px;border-radius:12px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(6,182,212,0.3);">
                Lancer l'application
              </button>
            </div>
          `;
        }
      }, 5000);
    </script>
  </body>
</html>
